name: "Example App Setup"
description: "Sets up Node.js and bun for the example app"
author: "Confect"

runs:
  using: "composite"
  steps:
    - name: Get bun version from package.json
      id: bun-version
      shell: bash
      run: echo "bun_version=$(node -p 'require(`./package.json`).engines.bun')" >> $GITHUB_OUTPUT

    - name: Setup bun
      uses: bun/action-setup@v4
      with:
        version: ${{ steps.bun-version.outputs.bun_version }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: "package.json"
        cache: "bun"

    - name: Install dependencies
      run: bun install
      shell: bash

    - name: Build confect package (dependency)
      run: bun --filter @rjdellecese/confect build
      shell: bash

    - name: Generate Convex types (confect)
      run: bun --filter @rjdellecese/confect convex-codegen
      shell: bash

    - name: Generate Convex types (example)
      run: bun --filter example convex-codegen
      shell: bash